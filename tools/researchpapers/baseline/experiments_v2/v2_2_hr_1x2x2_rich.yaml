# baseline_v2 / v2_2 — (1,2,2) + richaug, LONG converged train.
# THE FAIR RESOLUTION TEST: same richaug + same long budget as v2_1, only downsample differs.
# Question: with a fair converged budget, does (1,2,2) v2_2 > (1,4,4) v2_1? (v1's equal-budget A/B
# was confounded by undertraining — the 4x-voxel detector starved at max_iters=300, recall collapsed.)
# Density-CHANGING vs pilkwang -> golden-12 partly blind (Rule 1): report recall-proxy + count-vs-estN,
# flag detection gains NEEDS-LB (human submits).
name: baseline_v2_v2_2_hr_1x2x2_rich

purpose: >
  (1,2,2) higher-resolution detector with the v1-proven rich augmentation pipeline, trained to
  CONVERGENCE (same long budget as v2_1). The fair resolution A/B: is finer XY localization worth it
  once the detector is properly trained? Judge v2_2 - v2_1 on golden-12 official + recall-proxy.

paths:
  python:  research/cellmot_venv/bin/python
  trainer: research/official_repo/scripts/train_unet_transformer.py
  pythonpath: [research/official_repo/src, research/official_repo/scripts, .]
  data_dir:  input/biohub-cell-tracking-during-development/train
  splits:    learning/ensemble_work/finetune/splits_ft.json
  cache_dir: research/cache/ds1x2x2                            # per-config cache: (1,2,2)

mlflow:
  tracking_uri:  http://localhost:5000
  experiment:    kaggle-biohub-cell-tracking
  run_name:      baseline_v2_v2_2_hr_1x2x2_rich
  log_artifacts: false

gpu:
  power_limit_w: 400

train:
  method:              baseline_v2_v2_2_hr_1x2x2_rich
  split:               0
  downsample:          "1,2,2"
  epochs:              30
  lr:                  1e-4
  batch_size:          4              # (1,2,2) memory-safe (batch 8 OOMs on 32GB; 6 fits, 4 proven in v1)
  num_workers:         4
  det_loss_weight:     10.0
  det_neg_weight:      0.01
  window_size:         2
  pool_kernel_um:      5.0
  max_iters:           1000           # LONG: v1 (1,2,2) starved at 300 -> recall 0.70; give it a fair budget
  early_stop_patience: 12
  lr_schedule:         cosine         # PINNED in-config (reproducible; matches v2_1 for a clean A/B)
  lr_warmup:           2

augment:
  - {name: brightness, p: 1.0, shift_range: 0.1}
  - {name: flip,       p: 1.0, pz: 0.0, py: 0.5, px: 0.5}
  - {name: rot90_xy,   p: 1.0}
  - {name: gamma,      p: 0.5, range: 0.3}
  - {name: contrast,   p: 0.5, range: 0.2}
