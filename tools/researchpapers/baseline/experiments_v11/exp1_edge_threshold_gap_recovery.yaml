# Stage 2 exp#1: Edge-Length Threshold + Gap-Recovery (golden-12 pilot)
# Target: Count penalty relief (over-prediction correction)
# Configuration for post-processing pipeline

name: stage2_exp1_edge_threshold_gap_recovery
description: |
  Post-process pilkwang predictions: edge-length threshold + gap-recovery.
  Reduces over-prediction (count_ratio 1.2370 → target 1.0).

  Strategy:
    1. Load pilkwang FIXED predictions (.geff)
    2. Filter edges by length: discard edges > L_max
    3. Gap-recovery: re-link broken tracks in local neighborhood
    4. Re-score vs ground truth

input:
  predictions_dir: /home/seshu/kaggle/2026/biohub-cell-tracking-during-development/research/pilkwang_support_pack/repo/predictions/seshu/unet_transformer/split_0

postproc:
  edge_length_max_um: 12.0  # Threshold for edge filtering (microns)
  gap_recovery_enabled: true
  gap_recovery_max_gap_frames: 1
  gap_recovery_max_distance_um: 6.0
  gap_recovery_velocity_weight: 0.5

output:
  predictions_dir: /home/seshu/kaggle/2026/biohub-cell-tracking-during-development/tools/researchpapers/output/stage2/exp1_predictions
  format: geff

evaluation:
  split_file: /home/seshu/kaggle/2026/biohub-cell-tracking-during-development/learning/ensemble_work/finetune/fleet_loeo_mini.json
  fold: 0  # golden-12 pilot uses fold 0 test set
  use_official_scorer: true
  use_metric_anatomy: true

tracking:
  mlflow_enabled: true
  run_name: stage2_exp1_edge_threshold_gap_recovery_golden12
  metrics_to_log:
    - official_score
    - adj_edge_jaccard
    - R_node
    - R_edge
    - Q_link
    - count_ratio
    - count_penalty
    - div_J
