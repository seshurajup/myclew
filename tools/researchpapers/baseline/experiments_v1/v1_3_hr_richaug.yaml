# baseline_v1 / v1_3 — (1,2,2) HIGHER-RES + richer data-grounded augs (rot90_xy / gamma / contrast).
# A/B vs v1_2 (same resolution, minimal augs) isolates the AUGMENTATION effect. Absorbs the aug
# testing INTO v1 (the standalone config/aug_ablation/ stalled and produced no RESULTS.txt).
# rot90_xy is valid because XY is ~isotropic; Z-flip stays OFF (directional depth attenuation).
name: baseline_v1_v1_3_hr_richaug

purpose: >
  (1,2,2) detector with data-grounded augmentations (rot90_xy in-plane, gamma, contrast) on top of
  brightness+flip. Tests whether richer augmentation raises held-out detector recall / adj_edge over
  v1_2 at the same finer resolution. Keep an aug only if it improves the golden-12 official metric
  (and, for detection-recall gains, the recall proxy) — never on train loss alone.

paths:
  python:  research/cellmot_venv/bin/python
  trainer: research/official_repo/scripts/train_unet_transformer.py
  pythonpath:
    - research/official_repo/src
    - research/official_repo/scripts
    - .
  data_dir:  input/biohub-cell-tracking-during-development/train
  splits:    learning/ensemble_work/finetune/splits_ft.json
  cache_dir: research/cache/ds1x2x2

mlflow:
  tracking_uri:  http://localhost:5000
  experiment:    kaggle-biohub-cell-tracking
  run_name:      baseline_v1_v1_3_hr_richaug
  log_artifacts: false

gpu:
  power_limit_w: 400

train:
  method:              baseline_v1_v1_3_hr_richaug
  split:               0
  downsample:          "1,2,2"
  epochs:              30
  lr:                  1e-4
  batch_size:          4
  num_workers:         8
  det_loss_weight:     10.0
  det_neg_weight:      0.01
  window_size:         2
  pool_kernel_um:      5.0
  max_iters:           300
  early_stop_patience: 8

# Richer, data-grounded pipeline. Geometric augs are "free" (no intensity change) -> higher p;
# photometric augs fire probabilistically so only ~1-2 stack per sample (avoids fp16 UNet overflow).
augment:
  - {name: brightness, p: 1.0, shift_range: 0.1}
  - {name: flip,       p: 1.0, pz: 0.0, py: 0.5, px: 0.5}
  - {name: rot90_xy,   p: 1.0}                 # in-plane 90deg rotations (XY ~isotropic) — free geometry
  - {name: gamma,      p: 0.5, range: 0.3}     # per-embryo staining/optics robustness
  - {name: contrast,   p: 0.5, range: 0.2}     # contrast varies ~18x across embryos (E50 EDA)
