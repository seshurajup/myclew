# Stage 3 v12-1: Gap-Recovery Baseline (control)
name: stage3_v12_1_baseline
description: |
  Gap-recovery parameter sweep baseline (control).
  Replicates Stage 2 exp#1 configuration.
  Validates that golden-12 scoring pipeline is consistent.

input:
  predictions_dir: /home/seshu/kaggle/2026/biohub-cell-tracking-during-development/research/pilkwang_support_pack/repo/predictions/seshu/unet_transformer/split_0

postproc:
  edge_length_max_um: 12.0
  gap_recovery_enabled: true
  gap_recovery_max_distance_um: 6.0      # Control
  gap_recovery_max_gap_frames: 1
  gap_recovery_velocity_weight: 0.5

output:
  predictions_dir: /home/seshu/kaggle/2026/biohub-cell-tracking-during-development/tools/researchpapers/output/stage3/v12_1_baseline

evaluation:
  split_file: /home/seshu/kaggle/2026/biohub-cell-tracking-during-development/learning/ensemble_work/finetune/fleet_loeo_mini.json
  eval_set: golden_12
  use_official_scorer: true
  use_metric_anatomy: true

tracking:
  mlflow_enabled: true
  run_name: stage3_v12_1_baseline_golden12
  metrics_to_log:
    - official_score
    - adj_edge_jaccard
    - R_node
    - R_edge
    - Q_link
    - delta_from_baseline
