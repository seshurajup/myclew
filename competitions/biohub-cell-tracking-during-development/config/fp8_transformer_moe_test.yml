# ============================================================================
# fp8_transformer_moe_test.yml — SMALL functional MoE smoke config (NOT a speed test).
# Proves: n_experts=4 top_k=2 trains, loss decreases, per-expert fp8 runs WITHOUT the grouped_mm error
# (torch._scaled_grouped_mm is Hopper-only and RAISES on sm_120 → we loop _scaled_mm per expert), and the
# load-balance aux-loss keeps experts balanced. Dims are reduced so 4 experts × MLP fit VRAM at a small batch.
# The default production config (config/fp8_transformer.yml) keeps n_experts=1 (DENSE).
# ============================================================================
run:
  name: fp8_moe_test
  seed: 42
  device: cuda
  out_dir: experiments/fp8_ckpt
  comp: biohub-cell-tracking-during-development
  track: true
  dry_run_first: true

model:
  d_model: 1536                        # < 3072 → guardrail warns (functional MoE test, not a speed claim);
  ffn: 6144                            #   max matmul 6144 ≥ 1024 so select_train_precision still picks fp8.
  depth: 4
  heads: 12
  seq: 256
  vocab: 32000
  activation: gelu
  norm: layer
  n_experts: 4                         # MoE ON
  moe_top_k: 2
  moe_layers: all                      # all 4 blocks become MoE-FFN

precision:
  amp_dtype: auto
  path: native
  torch_compile: true                  # auto-forced OFF because MoE is on (eager per-expert fp8)

train:
  batch: 8
  accum_steps: 1
  epochs: 1
  steps_per_epoch: 30
  warmup_steps: 5
  optimizer: adamw
  lr: 3.0e-4
  val_frac: 0.05
  moe_aux_coef: 0.01

data:
  source: corpus
  corpus: experiments/fp8_corpus.txt

gate:
  measure_fp8_vs_bf16: false           # MoE is eager — no dense speed probe
  track_val: true
  val_batches: 6
  capture_failures: true
  capture_failures_topn: 8
  xai_every: 0
  power_limit_w: 400
