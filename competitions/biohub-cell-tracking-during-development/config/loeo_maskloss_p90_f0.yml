# =====================================================================
# [A] AGGRESSIVE MASKED DETECTION LOSS P=90 — fold0 decisive test (train 6bba -> test 44b6)
# The P=98 mask was INERT (predN +0.2% vs conv, neutral score) — too conservative. This ignores
# the top-10% brightest non-GT voxels (P=90) to see if the mask ACTUALLY ENGAGES detection.
# Paired with the UNDER-DETECTOR-INCLUSIVE eval (fleet_loeo_underdet: mini-8 + 144b256d + 12dfb391)
# so we can measure where the mask CAN win (mini-8 over-predicts 7/8, is blind to under-detection).
# 150it FAST-SCREEN. Decisive read: does P=90 recover under-detection on 144b256d (0.506->up) WITHOUT
# tanking the over-predictors? See docs/detector_maskloss_v3_design.md.
# Run:  bash start_train.sh config/loeo_maskloss_p90_f0.yml
# =====================================================================
name: loeo_maskloss_p90_f0

purpose: >
  Aggressive sparse-annotation masked loss (P=90, ignore top-10% brightest non-GT) fold0, 150it.
  Tests whether a stronger mask engages detection (P=98 was inert, +0.2% predN). Evaluated on the
  under-detector-inclusive split so the mask's target failure mode (dense 44b6 under-detection,
  144b256d 0.506) is actually measured — mini-8 alone over-predicts and is blind to it.

paths:
  python:  research/cellmot_venv/bin/python
  trainer: research/official_repo/scripts/train_unet_transformer.py
  pythonpath:
    - research/official_repo/src
    - research/official_repo/scripts
    - .
  data_dir: input/biohub-cell-tracking-during-development/train
  splits:   research/student/loeo_valheldout_f0.json    # train 6bba / val 6bba (leak-clean)
  cache_dir: research/cache/ds1x4x4

mlflow:
  tracking_uri: http://localhost:5000
  experiment:   kaggle-biohub-loeo
  run_name:     loeo_maskloss_p90_f0_train6bba_test44b6
  log_artifacts: false

gpu:
  power_limit_w: 400

train:
  method:          loeo_maskloss_p90_f0
  split:           0
  downsample:      "1,4,4"
  epochs:          12             # 150it FAST-SCREEN
  lr:              1e-4
  batch_size:      8
  num_workers:     0
  det_loss_weight: 10.0
  det_neg_weight:  0.01
  det_fg_ignore:   90             # AGGRESSIVE (was 98): ignore top-10% brightest non-GT from the negative term
  early_stop_patience: 4
  window_size:     2
  pool_kernel_um:  5.0
  max_iters:       150

augment:
  - {name: flip,       pz: 0.0, py: 0.5, px: 0.5}
  - {name: rot90_xy}
  - {name: scale,      p: 0.3, range: 0.12}
  - {name: crop,       p: 0.2, min_frac: 0.65}
  - {name: cutout,     p: 0.2, n: 1, max_frac: 0.2}
  - {name: brightness, p: 0.5, shift_range: 0.08}
  - {name: contrast,   p: 0.5, range: 0.15}
  - {name: gamma,      p: 0.3, range: 0.25}
  - {name: bias_field, p: 0.3, strength: 0.2}
  - {name: blur,       p: 0.2, sigma: 0.6}
  - {name: noise,      p: 0.2, sigma: 0.02}
